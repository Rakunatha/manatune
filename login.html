<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manatune: sign in</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--text:#11151b;--mut:#5b6471;--bd:#d9dee7;--blue:#1f7ae8;--blue2:#1665c4;--bad:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#0f1114;--card:#181b20;--text:#fff;--mut:#a7adb6;--bd:#262b33;--blue:#2d8cff;--blue2:#1a5fb4;--bad:#ff7a6b}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;padding:16px}
.box{width:100%;max-width:380px}
.logo{color:var(--blue);font-size:30px;font-weight:800;letter-spacing:-.02em;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:20px}
.tabs{display:flex;gap:4px;background:var(--bg);padding:3px;border-radius:8px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:none;color:var(--mut);font-weight:600;padding:8px;border-radius:6px;cursor:pointer;font-size:13px}
.tabs button.on{background:var(--blue);color:#fff}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px}
input,select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--bd);border-radius:6px;padding:10px;font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.go{width:100%;margin-top:18px;background:var(--blue);color:#fff;border:0;border-radius:20px;padding:11px;font-weight:700;font-size:14px;cursor:pointer}
.go:hover{background:var(--blue2)}
.err{color:var(--bad);margin:0 0 4px}
.hint{color:var(--mut);font-size:12px;margin:6px 0 0}
form{display:none}form.on{display:block}
.g{display:block;text-align:center;text-decoration:none;color:var(--text);background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:10px;font-weight:700}
.g:hover{border-color:var(--blue)}
.or{text-align:center;color:var(--mut);font-size:12px;margin:12px 0}
</style>
</head>
<body>
<div class="box">
  <div class="logo">Manatune</div>
  <div class="card">
    {% for m in get_flashed_messages() %}<p class="err">{{ m }}</p>{% endfor %}
    {% if google_enabled %}<a class="g" href="/auth/google">Continue with Google</a><div class="or">or use email</div>{% endif %}
    <div class="tabs">
      <button type="button" id="b-login" onclick="tab('login')">Sign in</button>
      <button type="button" id="b-signup" onclick="tab('signup')">Create account</button>
    </div>
    <form id="f-login" method="post" action="/login">
      <label for="le">Email</label><input id="le" name="email" type="email" autocomplete="email" required>
      <label for="lp">Password</label><input id="lp" name="password" type="password" autocomplete="current-password" required>
      <button class="go">Sign in</button>
    </form>
    <form id="f-signup" method="post" action="/signup">
      <label for="sn">Name (or firm name)</label><input id="sn" name="name" autocomplete="name" required>
      <label for="se">Email</label><input id="se" name="email" type="email" autocomplete="email" required>
      <label for="sp">Password</label><input id="sp" name="password" type="password" minlength="8" autocomplete="new-password" required>
      <p class="hint">At least 8 characters.</p>
      <label for="sr">I am joining as</label>
      <select id="sr" name="role"><option value="creator">A creator or music lover</option><option value="advocate">An IP advocate or firm</option></select>
      <button class="go">Create account</button>
    </form>
  </div>
</div>
<script>
function tab(t){['login','signup'].forEach(function(x){document.getElementById('f-'+x).className=x===t?'on':'';document.getElementById('b-'+x).className=x===t?'on':''})}
tab('{{ tab }}');
</script>
</body>
</html>
