databases:
  - name: manatune-db
    databaseName: manatune
    plan: free
    ipAllowList: []   # internal connections only (the web service uses the internal URL)
services:
  - type: web
    name: manatune
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --preload --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: manatune-db
          property: connectionString
      - key: PUBLIC_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: REPORT_HIDE_AT
        value: "3"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: FREE_GENERATIONS
        value: "3"
      - key: PAID_GENERATIONS
        value: "50"
      - key: PASS_PRICE_INR
        value: "199"
      - key: PASS_DAYS
        value: "30"
