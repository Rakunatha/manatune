databases:
  - name: manatune-db
    databaseName: manatune
    plan: free
services:
  - type: web
    name: manatune
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: manatune-db
          property: connectionString
